<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lottie Color Swapper</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app-layout">
      <header id="app-header">
        <div class="header-text">
          <h1>Lottie Color Swapper</h1>
          <p class="subtitle">Lottie 파일을 업로드하고 색상을 실시간으로 편집하세요</p>
        </div>
      </header>
      <div id="app-body">
        <aside id="hierarchy-panel">
          <div id="upload-section">
            <label for="lottie-upload" class="upload-button">Lottie 파일 업로드</label>
            <input type="file" id="lottie-upload" accept="application/json,.json,.lottie" />
            <div id="color-actions">
              <button id="initialize-colors-btn" type="button" disabled>색상 초기화</button>
              <button id="undo-btn" type="button" disabled>실행 취소</button>
            </div>
            <button id="export-btn" type="button" disabled>JSON으로 내보내기</button>
            <div id="notification" role="status" aria-live="polite"></div>
          </div>
          <div id="hierarchy-tree"></div>
        </aside>
        <main id="render-area">
          <div id="canvas-frame">
            <span id="canvas-ribbon">Preview</span>
            <canvas id="canvas"></canvas>
          </div>
          <span id="canvas-size"></span>
          <div id="cvd-controls">
            <label for="cvd-select">접근성 보정</label>
            <select id="cvd-select" disabled>
              <option value="none">없음</option>
              <option value="protanopia">적색맹용 보정</option>
              <option value="deuteranopia">녹색맹용 보정</option>
              <option value="tritanopia">청색맹용 보정</option>
            </select>
          </div>
          <div id="playback-controls">
            <button id="play-pause-btn" type="button" aria-label="재생/일시정지">⏸</button>
            <button id="stop-btn" type="button" aria-label="정지">⏹</button>
            <input id="seek-bar" type="range" min="0" max="0" value="0" step="1" />
            <span id="frame-counter">0 / 0</span>
          </div>
        </main>
      </div>
    </div>
    <div id="drop-overlay">
      <div class="drop-overlay-box">Lottie 파일을 여기에 놓으세요</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
